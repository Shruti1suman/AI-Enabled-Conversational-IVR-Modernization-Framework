<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IVR Web Simulator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>📞 IVR Web Simulator</h1>

    <div class="call-section">
      <input id="caller" type="text" placeholder="Enter your phone number">
      <button onclick="startCall()">Start Call</button>
    </div>

    <div id="ivr-display" class="ivr-display"></div>

    <div id="keypad" class="keypad">
        <button class="digit" onclick="sendDTMF('1')">1</button>
        <button class="digit" onclick="sendDTMF('2')">2</button>
        <button class="digit" onclick="sendDTMF('3')">3</button><br>
        <button class="digit" onclick="sendDTMF('4')">4</button>
        <button class="digit" onclick="sendDTMF('5')">5</button>
        <button class="digit" onclick="sendDTMF('6')">6</button><br>
        <button class="digit" onclick="sendDTMF('7')">7</button>
        <button class="digit" onclick="sendDTMF('8')">8</button>
        <button class="digit" onclick="sendDTMF('9')">9</button><br>
        <button class="digit" onclick="sendDTMF('*')">*</button>
        <button class="digit" onclick="sendDTMF('0')">0</button>
        <button class="digit" onclick="sendDTMF('#')">#</button>

    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
